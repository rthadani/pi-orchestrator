name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish with --dry-run and upload nothing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' (v${tag_version}) does not match package version '${pkg_version}'."
            exit 1
          fi
      - name: Run tests
        run: node test/roster-render.test.mjs
      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation token with publish rights to the @rthadani scope as a repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "NPM_TOKEN is present"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dry_run="${{ inputs.dry_run }}"
          if [ "$dry_run" = "true" ]; then
            echo "dry run: no package will be uploaded"
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
